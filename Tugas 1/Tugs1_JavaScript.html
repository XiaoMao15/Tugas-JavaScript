<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Luas Bangun Datar</title>
</head>
<body>

    <h1>Menghitung Luas Bangun Datar</h1>

   <script>
    // Menghitung luas persegi panjang
    function luasPersegiPanjang(panjang, lebar) {
        return panjang * lebar;
    }

    // Menghitung luas bujur sangkar
    function luasBujurSangkar(sisi) {
        return sisi * sisi;
    }

    // Menghitung luas segitiga
    function luasSegitiga(alas, tinggi) {
        return 0.5 * alas * tinggi;
    }

    // Nilai yang digunakan
    let panjang = 10;
    let lebar = 5;
    let sisi = 6;
    let alas = 8;
    let tinggi = 4;

    // Menghitung luas masing-masing bangun
    let luasPP = luasPersegiPanjang(panjang, lebar);
    let luasBS = luasBujurSangkar(sisi);
    let luasS = luasSegitiga(alas, tinggi);

    // Menampilkan hasil ke halaman
    document.write("Luas Persegi Panjang: " + luasPP + "<br>");
    document.write("Luas Bujur Sangkar: " + luasBS + "<br>");
    document.write("Luas Segitiga: " + luasS);
</script>

</body>
</html>
