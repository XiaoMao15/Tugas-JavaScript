<!DOCTYPE html>
<html>

<head>
    <title>Tugas 2 JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 90%;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #eeeeee;
        }

        tfoot {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Data Pegawai</h2>

    <script>

        let nama = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "Manajer";
        let status = "Menikah";

        let gajiPokok = 0;

        if (jabatan == "Manajer") {
            gajiPokok = 15000000;
        } else if (jabatan == "Asisten Manajer") {
            gajiPokok = 10000000;
        } else if (jabatan == "Staff") {
            gajiPokok = 5000000;
        }

        let tunjanganJabatan = 15 / 100 * gajiPokok;

        let bpjs = 10 / 100 * gajiPokok;

        let tunjanganKeluarga = (status == "Menikah")
            ? 20 / 100 * gajiPokok
            : 0;

        let totalGaji = gajiPokok
            + tunjanganJabatan
            + bpjs
            + tunjanganKeluarga;

        document.write(`
            <table>

                <thead>
                    <tr>
                        <th>Nama Pegawai</th>
                        <th>Umur</th>
                        <th>Jabatan</th>
                        <th>Status</th>
                        <th>Gaji Pokok</th>
                        <th>Tunjangan Jabatan</th>
                        <th>BPJS</th>
                        <th>Tunjangan Keluarga</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>${nama}</td>
                        <td>${umur}</td>
                        <td>${jabatan}</td>
                        <td>${status}</td>
                        <td>Rp ${gajiPokok.toLocaleString('id-ID')}</td>
                        <td>Rp ${tunjanganJabatan.toLocaleString('id-ID')}</td>
                        <td>Rp ${bpjs.toLocaleString('id-ID')}</td>
                        <td>Rp ${tunjanganKeluarga.toLocaleString('id-ID')}</td>
                    </tr>
                </tbody>

                <tfoot>
                    <tr>
                        <td colspan="7">Total Gaji</td>
                        <td>Rp ${totalGaji.toLocaleString('id-ID')}</td>
                    </tr>
                </tfoot>

            </table>
        `);

    </script>

</body>

</html>
