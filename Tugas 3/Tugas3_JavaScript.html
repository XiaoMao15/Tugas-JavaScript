<!DOCTYPE html>
<html>

<head>
    <title>Tugas 3 JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #eeeeee;
        }
    </style>
</head>

<body>

    <h2>Manajemen Produk Toko</h2>

    <div id="daftarProduk"></div>

    <script>

        let produkToko = [
            { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
            { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
            { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
        ];

        function tambahProduk(nama, harga, stok) {
            let idBaru = produkToko.length + 1;

            produkToko.push({
                id: idBaru,
                nama: nama,
                harga: harga,
                stok: stok
            });
        }

        function hapusProduk(id) {
            produkToko = produkToko.filter(function (produk) {
                return produk.id !== id;
            });
        }

        function tampilkanProduk() {
            let tabel = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama</th>
                            <th>Harga</th>
                            <th>Stok</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            produkToko.forEach(function (produk) {
                tabel += `
                    <tr>
                        <td>${produk.id}</td>
                        <td>${produk.nama}</td>
                        <td>Rp ${produk.harga.toLocaleString("id-ID")}</td>
                        <td>${produk.stok}</td>
                    </tr>
                `;
            });

            tabel += `
                    </tbody>
                </table>
            `;

            document.getElementById("daftarProduk").innerHTML = tabel;
        }

        tampilkanProduk();

        tambahProduk("Headset", 500000, 8);

        hapusProduk(2);

        tampilkanProduk();

    </script>

</body>

</html>
